<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#07090e" />
      <stop offset="100%" stop-color="#05060a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#eab308" />
      <stop offset="70%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="#ca8a04" stroke-width="6" stroke-opacity="0.3" />

  <!-- Grid lines -->
  <line x1="80" y1="160" x2="432" y2="160" stroke="#ca8a04" stroke-opacity="0.1" stroke-width="2" stroke-dasharray="6,6" />
  <line x1="80" y1="256" x2="432" y2="256" stroke="#ca8a04" stroke-opacity="0.1" stroke-width="2" stroke-dasharray="6,6" />
  <line x1="80" y1="352" x2="432" y2="352" stroke="#ca8a04" stroke-opacity="0.1" stroke-width="2" stroke-dasharray="6,6" />
  <line x1="160" y1="80" x2="160" y2="432" stroke="#ca8a04" stroke-opacity="0.1" stroke-width="2" stroke-dasharray="6,6" />
  <line x1="256" y1="80" x2="256" y2="432" stroke="#ca8a04" stroke-opacity="0.1" stroke-width="2" stroke-dasharray="6,6" />
  <line x1="352" y1="80" x2="352" y2="432" stroke="#ca8a04" stroke-opacity="0.1" stroke-width="2" stroke-dasharray="6,6" />

  <!-- Candlesticks in background -->
  <!-- Candle 1: Bearish -->
  <line x1="140" y1="210" x2="140" y2="320" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />
  <rect x="130" y="235" width="20" height="60" rx="3" fill="#ef4444" opacity="0.8" />

  <!-- Candle 2: Bullish Reversal at Demand -->
  <line x1="200" y1="260" x2="200" y2="380" stroke="#22c55e" stroke-width="3" stroke-linecap="round" />
  <rect x="190" y="280" width="20" height="70" rx="3" fill="#22c55e" opacity="0.85" />

  <!-- Candle 3: Strong Expansion -->
  <line x1="260" y1="180" x2="260" y2="320" stroke="#22c55e" stroke-width="3" stroke-linecap="round" />
  <rect x="250" y="195" width="20" height="95" rx="3" fill="#22c55e" opacity="0.95" />

  <!-- Candle 4: ATH Momentum -->
  <line x1="320" y1="120" x2="320" y2="240" stroke="#22c55e" stroke-width="3" stroke-linecap="round" />
  <rect x="310" y="135" width="20" height="85" rx="3" fill="#22c55e" />

  <!-- Candle 5: Pullback test -->
  <line x1="380" y1="150" x2="380" y2="230" stroke="#eab308" stroke-width="3" stroke-linecap="round" />
  <rect x="370" y="165" width="20" height="40" rx="3" fill="#eab308" />

  <!-- EMA Trend Wave Glowing Path -->
  <path d="M 90 340 Q 180 320 230 250 T 360 160 T 430 110" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" filter="url(#glow)" />

  <!-- Central XAU Emblem -->
  <g transform="translate(256, 380)">
    <!-- Pill container -->
    <rect x="-110" y="-32" width="220" height="64" rx="32" fill="#111827" stroke="url(#goldGrad)" stroke-width="3" />
    <text x="0" y="8" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">XAU / USD</text>
    <circle cx="-85" cy="0" r="6" fill="#22c55e" />
  </g>

  <!-- AI Signal Pulse Marker -->
  <g transform="translate(360, 155)">
    <circle cx="0" cy="0" r="18" fill="#eab308" fill-opacity="0.3" />
    <circle cx="0" cy="0" r="10" fill="#facc15" />
    <polygon points="-4,3 0,-4 4,3" fill="#000" />
  </g>
</svg>
